<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08101d" />
    <title>Crypto Hub — Offline</title>
    <style>
      :root { color-scheme: dark; background: #060a12; color: #e5edf7; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { min-height: 100dvh; box-sizing: border-box; display: grid; place-items: center; margin: 0; padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left)); }
      main { max-width: 34rem; border: 1px solid rgba(148,163,184,.18); border-radius: 1rem; background: #09101c; padding: 1.5rem; box-shadow: 0 20px 70px rgba(0,0,0,.28); }
      .eyebrow { color: #fcd34d; font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: .6rem 0; font-size: 1.35rem; }
      p { margin: .5rem 0 0; color: #94a3b8; font-size: .9rem; line-height: 1.6; }
      strong { color: #e5edf7; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Offline · Read only</div>
      <h1>Crypto Hub needs a live connection for market actions.</h1>
      <p>The application shell is available, but <strong>live data is unavailable</strong>. Paper Trading, settings, alerts, and Research Lab changes remain online-only.</p>
    </main>
  </body>
</html>
